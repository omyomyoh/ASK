<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사업·성과관리 무엇이든 물어보세요</title>
<meta property="og:title" content="사업관리, 성과관리 관련 무엇이든 물어보세요!">
<meta property="og:description" content="이름 없이 익명으로 질문을 남겨 주세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one Instagram-story canvas (9:16 feel), photo in the middle, question sticker overlapping it. Single dark look by choice. */
:root {
  --canvas: #4a4a4c;
  --canvas-deep: #2f2f31;
  --sticker: #ffffff;
  --ink: #111111;
  --muted: #6b6b70;
  --field: #e6e6e8;
  --accent: #e1306c;
  --ok: #1f9d55;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
body {
  background: var(--canvas-deep);
  color: var(--ink);
  font-family: var(--font);
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.story {
  position: relative;
  height: 100%;
  max-width: 440px;
  margin: 0 auto;
  background: linear-gradient(180deg, #3e3e40 0%, var(--canvas) 45%, #5a5752 100%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.photo {
  flex: none;
  width: 100%;
  height: auto;
  max-width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  object-position: 50% 50%;
  display: block;
  position: relative;
  z-index: 1;
  margin-top: -9%;
}
.stage {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: calc(90px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sticker {
  flex: none;
  position: relative;
  z-index: 2;
  width: min(272px, 100%);
  background: var(--sticker);
  border-radius: 16px;
  padding: 14px 12px 10px;
  box-shadow: 0 6px 22px rgba(0,0,0,.3);
  text-align: center;
}
.sticker h1 {
  margin: 0 0 10px;
  font-size: 17px;
  font-weight: 700;
  line-height: 1.32;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  background: var(--field);
  border-radius: 10px;
  padding: 4px 4px 4px 0;
}
.field {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: 0;
  padding: 8px 4px 8px 12px;
  font: 400 15px/1.45 var(--font);
  color: var(--ink);
  text-align: left;
  resize: none;
  min-height: 38px;
  max-height: 120px;
  overflow-y: auto;
  outline: none;
}
.field::placeholder { color: #8a8a8f; }
.row:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.send {
  flex: none;
  border: 0;
  border-radius: 8px;
  padding: 7px 12px;
  font: 700 14px var(--font);
  color: #fff;
  background: linear-gradient(90deg, #f58529, #dd2a7b 55%, #8134af);
  cursor: pointer;
}
.send:disabled { opacity: .35; cursor: default; }
.send:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.note { margin: 6px 0 0; font-size: 11.5px; color: var(--muted); }
.note.err { color: #c62828; }
.toast {
  position: absolute; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 12px);
  background: rgba(20,20,22,.88); color: #fff;
  padding: 10px 16px; border-radius: 999px; font-size: 14px;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 5;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<main class="story">
  <div class="stage">
    <form class="sticker" id="askForm" autocomplete="off">
      <h1>사업관리, 성과관리 관련<br>무엇이든 물어보세요!</h1>

      <div class="row">

        <button class="send" id="sendBtn" type="submit" disabled>보내기</button>
      </div>
      <p class="note" id="note">이름 없이 익명으로 전달돼요</p>

<script>
(function () {
  // 구글 폼 연결 정보
  var FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLScW8--6TMV_vDtI0fTikUue3U5VRNC-_DhG2_Ofx74MzZcvSw/formResponse';
  var FIELD = 'entry.113170384';

  var form = document.getElementById('askForm');
  var field = document.getElementById('question');
  var sendBtn = document.getElementById('sendBtn');
  var note = document.getElementById('note');
  var toastEl = document.getElementById('toast');
  var sending = false, toastTimer;

  function grow() { field.style.height = 'auto'; field.style.height = Math.min(field.scrollHeight, 120) + 'px'; }
  function refresh() { sendBtn.disabled = sending || field.value.trim() === ''; }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
  }
  field.addEventListener('input', function () { grow(); refresh(); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = field.value.trim();
    if (!text || sending) return;
    sending = true; refresh();
    note.textContent = '보내는 중...'; note.classList.remove('err');
    var body = new URLSearchParams();
    body.append(FIELD, text);
    fetch(FORM_URL + '?' + body.toString(), { method: 'GET', mode: 'no-cors', cache: 'no-store' })
      .then(function () {
        field.value = ''; grow();
        note.textContent = '이름 없이 익명으로 전달돼요';
        toast('질문을 보냈어요');
      })
      .catch(function () {
        note.textContent = '전송하지 못했어요. 인터넷 연결을 확인하고 다시 보내 주세요.';
        note.classList.add('err');
      })
      .then(function () { sending = false; refresh(); });
  });
})();
</script>
